# Stage 2 — Feature Extraction，Snapshot Factor 骨架（xrp_supply_burn）
# 2026-08-02 新增，Ken 拍板「一幣一個」，XRP 選交易費銷毀／流通供給量。
#
# 端點（免 key，公開，實測不需 API key）：
#   GET https://api.xrpscan.com/api/v1/ledger
#   免費 Developer 方案每天 10,000 次請求。pipeline/fetch_onchain.py 的
#   `xrpscan_supplement` 已在用同一支。
#
# ⚠️ 2026-08-02 實測**回傳結構跟 pipeline/流程紀錄.md 先前記的不一樣**，要注意：
#   回的是 {"current_ledger": <int>, "ledgers": [ ...10 筆... ]}
#   不是單筆帳本物件。每筆 ledger 的欄位：
#     ledger_index / ledger_hash / close_time / close_time_human /
#     close_time_resolution / close_flags / parent_close_time / parent_hash /
#     transaction_hash / tx_count / total_coins / destroyed_coins
#   實測值：current_ledger = 106013770
#           total_coins = 99985632191457150（單位 drops，÷1e6 → XRP）
#           destroyed_coins = -544（該筆帳本燒掉的 drops）
#           tx_count = 47
#
# ⚠️ **只回最近 10 個帳本**。XRPL 出塊約 3-5 秒，10 筆 ≈ 40 秒。
#    這是本專案回看範圍最短的 factor（比 SOL tps 的 12 小時還短兩個數量級）。
#    → 結構性算不出 ic，Stage 4 走 domain_knowledge。

feature:
  factor: xrp_supply_burn
  endpoint: https://api.xrpscan.com/api/v1/ledger
  window_policy: not_applicable   # Snapshot 型，不吃 Horizon
  unit_conversion: xrp = drops / 1e6

  # Raw
  total_supply_xrp: ledgers[0].total_coins / 1e6
  destroyed_this_ledger_drops: ledgers[0].destroyed_coins
  tx_count: ledgers[0].tx_count
  ledger_index: ledgers[0].ledger_index
  close_time_human: ledgers[0].close_time_human

  # 這 10 筆窗內的彙總（唯一能算的「趨勢」，涵蓋約 40 秒）
  destroyed_in_window_drops: sum(l.destroyed_coins for l in ledgers)
  tx_count_mean: mean(l.tx_count for l in ledgers)
  window_seconds: ledgers[0].close_time - ledgers[-1].close_time

  # Quality
  sample_size: len(ledgers)       # 實測固定 10
  history_available: false

# ⚠️ 銷毀速率的量級要先講清楚，免得下游過度解讀：
#   2026-07-23 pipeline/流程紀錄.md 記的 total_coins = 99,985,633,424.35 XRP
#   2026-08-02 本次實測              total_coins = 99,985,632,191.46 XRP
#   → 10 天內減少約 **1,233 XRP**，佔總量（約 999.86 億）的 0.0000012%
#   這個速率在任何交易 horizon 下都不可能影響價格。這個 factor 的價值是
#   **敘事**（XRP 有制度性通縮機制）而不是**訊號**，Stage 4 的低權重就是照這個給的。
