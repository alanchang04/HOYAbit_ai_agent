# Stage 2 — Feature Extraction，幣種模板（BNB）
#
# 這份是「這個幣種要抓哪些 factor」，同資料夾其他 .yaml 是「一個 factor 怎麼抓」。
# LLM 先讀這份決定跑哪些端點，再各自去讀對應的 factor 規格檔拿欄位與公式。
#
# ⚠️ 目前只是文件，程式還沒讀它（2026-08-02 拍板：只寫模板、不動程式）。
# ⚠️ not_applicable 記的是「資料源／概念上拿不到」（事實），不是「選擇不抓」。
#
# 2026-08-02 v2：加入該幣的幣種專屬 factor（Ken 拍板「一幣一個」），
# 五個候選端點全部實打過，實測結果直接寫在各 factor 的 measured_2026_08_02 欄。

coin: BNB
name: BNB
chain: bnb_chain
perp_symbol: BNBUSDT
coingecko_id: binancecoin
factor_count: 7

factors:
  - factor: funding_rate
    spec: funding_rate.yaml
    endpoint: https://fapi.binance.com/fapi/v1/fundingRate
    params: {symbol: BNBUSDT, limit: "{{window * 3}}"}
    samples_per_day: 3

  - factor: price
    spec: price.yaml
    endpoint: https://api.coingecko.com/api/v3/simple/price
    params: {ids: binancecoin}
    note: 失敗退 CryptoCompare /data/pricemultifull 備援

  - factor: cpi
    spec: cpi.yaml
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv
    params: {id: CPIAUCSL}
    scope: global              # ⚠️ 總經資料，五幣共用同一份序列，抓回來的數字完全相同

  - factor: panews_sentiment
    spec: panews_sentiment.yaml
    endpoint: https://universal-api.panewslab.com/articles
    keywords_ref: pipeline/fetch_media_kol_mentions.py COIN_KEYWORDS[BNB]
    note: ⚠️ 關鍵字表五幣都有定義，但只有 BTC 做過實測

  - factor: momentum           # 2026-08-02 由另一條線取代原本的 liquidation
    spec: momentum.yaml
    endpoint: null             # ⚠️ 本地計算，零網路成本——唯一一個不打外部端點的 factor
    params: {lookback_days: "{{window}}"}
    samples_per_day: 1
    source_data: data/{coin}_daily_ohlcv.csv（主辦方共同基準資料集）
    algorithm_ref: agent/collectors/price.py `_rsi14`（不重寫第二份，避免算法漂移）
    note: 實際讀取的收盤價會多抓 14 天當 RSI 種子，那 14 天不計入 sample_size

  - factor: orderbook_depth
    spec: orderbook_depth.yaml
    endpoint: https://fapi.binance.com/fapi/v1/depth
    params: {symbol: BNBUSDT, limit: 1000}
    note: Snapshot 型，沒有 window 參數

  - factor: bnb_burn             # ⭐ 2026-08-02 新增的 BNB 幣種專屬 factor
    spec: bnb_burn.yaml
    factor_type: event           # 比照 cpi，不是 statistical
    endpoint: https://www.bnbchain.org/en/blog/{burn_index}th-bnb-burn
    window_policy: not_applicable
    measured_2026_08_02: |-
      ✅ 35th → Auto-Burn 1,569,307.34 BNB，剩餘總供給 134,786,916.53 BNB（2026-04-15）
      ✅ 34th → 1,371,803.77 BNB
      ❌ 30th／25th → HTTP 200 但空殼頁（SPA 不回 404）→ 必須用內文有無 "Auto-Burn" 判斷成功
      ❌ bnbburn.info 是 JS 渲染 SPA，靜態抓不到
      ❌ BscScan（Etherscan V2 chainid=56）當日重測仍被擋

not_applicable:
  - {factor: etf,            reason: "⚠️ 跟 ETH/SOL 不同層次的缺席——BNB 連「美國現貨 ETF」這個資產類別都不存在"}
  - {factor: active_address, reason: "blockchain.info 只涵蓋 BTC UTXO 鏈。BNB Chain 要同類指標得另找資料源"}
  - {factor: hash_rate,      reason: "⚠️ 概念不成立——BNB Chain 不是 PoW 鏈"}
